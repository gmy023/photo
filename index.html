<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>高曼荧的个人作品集</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="site-header">
    <nav class="nav container">
      <a class="logo" href="index.html">高曼荧<span>.design</span></a>
      <ul class="nav-menu">
        <li><a class="is-active" href="index.html">首页</a></li>
        <li><a href="photo.html">摄影</a></li>
        <li><a href="wardrobe.html">衣橱</a></li>
        <li><a href="day19/http-cards.html">HTTP</a></li>
        <li><a href="weather.html">天气</a></li>
      </ul>
    </nav>
  </header>

  <main>
    <section id="home" class="hero">
      <h1>你好，我是高曼荧</h1>
      <p>一名热爱排版与细节的 UI 设计师 / 前端学习者。</p>
      <a class="btn" href="photo.html">看看我的摄影</a>
    </section>

    <section id="about" class="about container">
      <img class="avatar" src="https://picsum.photos/seed/avatar/320/320" alt="高曼荧的头像照片">
      <article class="about-text">
        <h2>关于我</h2>
        <p>我是一个前端设计小白，擅长把复杂的信息整理成清爽的页面，习惯从用户的阅读顺序出发设计布局。</p>
        <p>目前正在系统学习 HTML 与 CSS，相信手写代码是理解设计落地最好的方式。平时喜欢带着相机出门拍照，欢迎和我聊聊设计、前端或者咖啡。</p>
      </article>
    </section>

    <section id="contact" class="contact container">
      <h2>联系我</h2>
      <form class="contact-form" action="#" method="post">
        <div class="form-item">
          <label for="name">姓名</label>
          <input type="text" id="name" name="name" placeholder="怎么称呼你？">
        </div>
        <div class="form-item">
          <label for="email">邮箱</label>
          <input type="email" id="email" name="email" placeholder="you@example.com">
        </div>
        <div class="form-item">
          <label for="message">留言</label>
          <textarea id="message" name="message" rows="5" placeholder="想聊点什么？"></textarea>
        </div>
        <button type="submit" class="btn">发送留言</button>
      </form>
    </section>
  </main>

  <footer class="site-footer">
    <p>© 2026 高曼荧个人作品集 | 用 HTML + CSS + JS 手写</p>
  </footer>
</body>
</html>
